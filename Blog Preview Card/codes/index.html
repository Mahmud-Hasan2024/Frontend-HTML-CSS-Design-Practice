<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blog Preview Card</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,500;0,800;1,500;1,800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="background">
      <section class="card">
        <img
          src="../blog-preview-card-main/assets/images/illustration-article.svg"
          class="card-img-top"
          alt="Article illustration"
        />
        <div class="card-body">
          <p><span class="badge theme-warning">Learning</span></p>
          <p class="card-subtitle">Published 21 Dec 2023</p>
          <h4 class="card-title">
            <a href="#">HTML & CSS foundations</a>
          </h4>
          <p class="card-text">
            These languages are the backbone of every website, defining
            structure, content, and presentation.
          </p>
          <div class="logo">
            <img
              class="avatar-img"
              src="../blog-preview-card-main/assets/images/image-avatar.webp"
              alt="Greg Hooper"
              width="32"
              height="32"
            />
            <p>Greg Hooper</p>
          </div>
        </div>
      </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
